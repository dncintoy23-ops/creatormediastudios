<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1427" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#03060a" />
    </linearGradient>

    <!-- Cyan to Cobalt Beam -->
    <linearGradient id="cyanCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="55%" stop-color="#4f7cff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <!-- Aperture Blade Gradient -->
    <linearGradient id="apertureBlade" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0.25" />
    </linearGradient>

    <!-- Gold Prism Accent -->
    <linearGradient id="goldPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Radial Optical Lens Glow -->
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#4f7cff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="4" />
  <circle cx="256" cy="256" r="225" fill="url(#lensGlow)" />

  <!-- Outer Track & Calibration Rings -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#00f2fe" stroke-width="3" stroke-dasharray="32 16 8 16 65 22" filter="url(#neonCyanGlow)" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="rgba(79, 124, 255, 0.25)" stroke-width="1.5" />

  <!-- Camera Lens Angle Markers (30° intervals) -->
  <g stroke="rgba(255, 255, 255, 0.22)" stroke-width="2">
    <line x1="256" y1="44" x2="256" y2="58" stroke="#00f2fe" stroke-width="3" />
    <line x1="256" y1="454" x2="256" y2="468" stroke="#00f2fe" stroke-width="3" />
    <line x1="44" y1="256" x2="58" y2="256" stroke="#00f2fe" stroke-width="3" />
    <line x1="454" y1="256" x2="468" y2="256" stroke="#00f2fe" stroke-width="3" />
    
    <line x1="106" y1="106" x2="116" y2="116" stroke="#4f7cff" stroke-width="2" />
    <line x1="406" y1="106" x2="396" y2="116" stroke="#4f7cff" stroke-width="2" />
    <line x1="106" y1="406" x2="116" y2="396" stroke="#4f7cff" stroke-width="2" />
    <line x1="406" y1="406" x2="396" y2="396" stroke="#4f7cff" stroke-width="2" />
  </g>

  <!-- Hexagonal Camera Aperture Blades -->
  <g transform="translate(256, 256)" stroke="#070b14" stroke-width="2.5">
    <path d="M 0 -130 L 112 -65 L 45 -25 Z" fill="url(#apertureBlade)" />
    <path d="M 0 -130 L 112 -65 L 45 -25 Z" fill="url(#apertureBlade)" transform="rotate(60)" />
    <path d="M 0 -130 L 112 -65 L 45 -25 Z" fill="url(#apertureBlade)" transform="rotate(120)" />
    <path d="M 0 -130 L 112 -65 L 45 -25 Z" fill="url(#apertureBlade)" transform="rotate(180)" />
    <path d="M 0 -130 L 112 -65 L 45 -25 Z" fill="url(#apertureBlade)" transform="rotate(240)" />
    <path d="M 0 -130 L 112 -65 L 45 -25 Z" fill="url(#apertureBlade)" transform="rotate(300)" />
  </g>

  <!-- Core Anamorphic Lens Barrel -->
  <circle cx="256" cy="256" r="92" fill="#070b14" stroke="url(#cyanCobalt)" stroke-width="5" filter="url(#neonCyanGlow)" />

  <!-- Horizontal Anamorphic Blue Flare Streak -->
  <line x1="60" y1="256" x2="452" y2="256" stroke="rgba(0, 242, 254, 0.45)" stroke-width="2.5" filter="url(#neonCyanGlow)" stroke-dasharray="130 12 18 12 130" />

  <!-- Bold Interlocking Iconic 'C' / Aperture Core -->
  <path d="M 295 200 C 280 186 258 178 234 178 C 190 178 156 212 156 256 C 156 300 190 334 234 334 C 260 334 282 324 297 308" 
        fill="none" 
        stroke="url(#cyanCobalt)" 
        stroke-width="26" 
        stroke-linecap="round" 
        filter="url(#neonCyanGlow)" />

  <!-- Inner Studio Prism Diamond -->
  <polygon points="256,232 278,256 256,280 234,256" fill="url(#goldPrism)" />
  <circle cx="256" cy="256" r="4" fill="#ffffff" />

  <!-- Studio Emblem Typography -->
  <text x="256" y="422" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#00f2fe" text-anchor="middle" letter-spacing="4.5">CREATOR MEDIA STUDIOS</text>
  <text x="256" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">COLOR SCIENCE &amp; DIGITAL MEDIA</text>
</svg>
